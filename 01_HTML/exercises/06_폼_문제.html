  <!--
================================================================================
 06. 폼 - 회원가입 양식 만들기

  [목표]
    - <form>의 기본 구조를 만들고 action, method 속성을 지정할 수 있다.
    - <input>의 다양한 type을 목적에 맞게 사용할 수 있다.
    - <label>과 입력 요소를 for / id로 올바르게 연결할 수 있다.
    - <fieldset>, <legend>로 폼을 구조화할 수 있다.
    - required로 필수 입력 항목을 지정할 수 있다.

  [유형]: 구현형

  [AI 활용 가이드]
    [먼저 스스로 생각해볼 것들]
      - 각 TODO에 어떤 태그가 필요할지 8_폼관련태그.html을 보면서 직접 찾아본다.
      - label과 input을 연결하는 방법은 반드시 스스로 손으로 써 본다. 뒤에서 계속 쓴다.

    [AI에게 물어보면 좋은 것]
      - "input type=email과 type=text는 실제로 뭐가 달라?"
      - "label의 for와 input의 id를 연결하면 어떤 이점이 있지?"
      - "radio 버튼들의 name을 동일하게 맞춰줘야 하는 이유가 뭐야?"

    [AI에게 통째로 시키지 말 것]
      - "예제를 풀어보려는데 회원가입 폼 만들어줘."라는 프롬프트 한 줄로 끝내는 것은 공부가 안된다.
      - 막히는 TODO 하나씩 물어보고, 받은 답을 읽고 이해한 뒤 직접 옮겨 적어보자.

  [완성 조건]
    1. 브라우저에서 열었을 때 모든 입력 항목에 라벨이 붙어 있다.
    2. 라벨 글자를 클릭하면 해당 입력창에 커서가 가거나 선택이 된다. (연결 확인용)
    3. 아이디와 비밀번호를 비우고 [가입하기]를 누르면 브라우저가 입력을 요구한다.
    4. 성별은 하나만 선택되고, 관심분야는 여러 개 선택된다.
================================================================================
-->

<body>
  <h1>회원가입</h1>

  <form action="#" method="post">
    <fieldset>
      <legend>기본 정보</legend>
      <p>
        <label for="userId">아이디 입력: </label>
        <input
          type="text"
          name="userId"
          id="userId"
          placeholder="아이디를 입력하세요"
          required
        />
      </p>
      <p>
        <label for="userPwd">비밀번호 입력: </label>
        <input type="password" name="userPwd" id="userPwd" required />
      </p>
      <p>
        <label for="email">이메일 입력: </label>
        <input type="email" name="email" id="email" />
      </p>
    </fieldset>

    <fieldset>
      <legend>추가 정보</legend>
      <p>
        성별:
        <input type="radio" id="male" name="gender" value="M" />
        <label for="male">남자</label>
        <input type="radio" id="female" name="gender" value="F" />
        <label for="female">여자</label>
      </p>
      <p>
        관심 분야:
        <input type="checkbox" id="topic1" name="interest" value="frontend" checked />
        <label for="topic1">프론트엔드</label>
        <input type="checkbox" id="topic2" name="interest" value="backend" />
        <label for="topic2">백엔드</label>
        <input type="checkbox" id="topic3" name="interest" value="ai" />
        <label for="topic3">AI</label>
      </p>
      <p>
        <label for="region">거주지역: </label>
        <select name="region" id="region">
          <option value="seoul">서울</option>
          <option value="gyeonggi">경기</option>
          <option value="busan">부산</option>
          <option value="etc">기타</option>
        </select>
      </p>
      <p>
        <label for="intro">자기소개:</label><br />
        <textarea name="intro" id="intro" cols="40" rows="5"></textarea>
      </p>
    </fieldset>

    <p>
      <button type="submit">가입하기</button>
      <button type="reset">다시 입력</button>
    </p>
  </form>
</body>
