<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>03_async와 await</title>
    <style>
      #log {
        background: #f4f4f4;
        padding: 10px;
        min-height: 120px;
        font-family: monospace;
      }
    </style>
  </head>

  <body>
    <h1>03. async와 await</h1>

    <button id="btn1">순서대로 실행 (await)</button>
    <button id="btn2">오류 처리 (try/catch)</button>
    <button id="btn3">사용자 가져오기 (200)</button>
    <button id="btn4">없는 사용자 가져오기 (404)</button>

    <h3>실행 결과</h3>
    <div id="log"></div>

    <script>
      const $log = document.getElementById("log");

      function log(message) {
        $log.insertAdjacentHTML("beforeend", `<div>${message}</div>`);
        console.log(message);
      }

    </script>

  </body>
</html>
