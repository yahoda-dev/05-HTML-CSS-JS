<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01_이벤트 핸들러 등록</title>
    <style>
        #log { background: #f4f4f4; padding: 10px; min-height: 80px; font-family: monospace; }
    </style>
</head>

<body>
    <h1>01. 이벤트 핸들러 등록</h1>

    <button id="btn">눌러 보세요</button>

    <h3>실행 결과</h3>
    <div id="log"></div>

    <script>
        const $log = document.getElementById('log');

        function log(message) {
            $log.insertAdjacentHTML('beforeend', `<div>${message}</div>`);
            console.log(message);
        }

    </script>

</body>

</html>
