<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02_이벤트 핸들러 제거</title>
    <style>
        #log { background: #f4f4f4; padding: 10px; min-height: 80px; font-family: monospace; }
    </style>
</head>

<body>
    <h1>02. 이벤트 핸들러 제거</h1>

    <h3>1. 제거되는 경우</h3>
    <button id="btn1">눌러도 아무 일이 없어야 한다</button>

    <h3>2. 제거되지 않는 경우</h3>
    <button id="btn2">눌러보면 여전히 동작한다</button>

    <h3>3. once 옵션</h3>
    <button id="btn3">처음 한 번만 동작한다</button>

    <h3>실행 결과</h3>
    <div id="log"></div>

    <script>
        const $log = document.getElementById('log');

        function log(message) {
            $log.insertAdjacentHTML('beforeend', `<div>${message}</div>`);
            console.log(message);
        }

    </script>

</body>

</html>
