<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>07_이벤트 전파</title>
    <style>
        ul { background: lightgray; padding: 20px; }
        li { background: lightblue; padding: 8px; margin: 4px; }
        #log { background: #f4f4f4; padding: 10px; min-height: 100px; font-family: monospace; }
    </style>
</head>

<body>
    <h1>07. 이벤트 전파</h1>

    <ul id="drink">
        <li>커피</li>
        <li>콜라</li>
        <li>우유</li>
    </ul>

    <h3>실행 결과</h3>
    <div id="log"></div>

    <script>
        const $log = document.getElementById('log');

        function log(message) {
            $log.insertAdjacentHTML('beforeend', `<div>${message}</div>`);
            console.log(message);
        }

    </script>

</body>

</html>
