<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02_setInterval</title>
    <style>
        #log { background: #f4f4f4; padding: 10px; min-height: 120px; font-family: monospace; }
        #clock { font-size: 2em; font-family: monospace; }
    </style>
</head>

<body>
    <h1>02. setInterval</h1>

    <h3>1. 5까지 세고 스스로 멈추기</h3>
    <button id="countBtn">세기 시작</button>

    <h3>2. 시계 - 버튼으로 멈추기</h3>
    <div id="clock">--:--:--</div>
    <button id="clockStart">시작</button>
    <button id="clockStop">정지</button>

    <h3>실행 결과</h3>
    <div id="log"></div>

    <script>
        const $log = document.getElementById('log');

        function log(message) {
            $log.insertAdjacentHTML('beforeend', `<div>${message}</div>`);
            console.log(message);
        }

    </script>

</body>

</html>
