<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>모듈 실행해보기</h1>
    <div id="output"></div>
    <!-- type을 module로 지정하는 이유는 JS에서 import를 사용하기 위해서이다 -->
    <script type="module">
      import { PI, add } from "./math.js";
      import greet from "./greeting.js";

      // 화면에 출력할 요소를 선택
      const output = document.getElementById("output");

      // 결과를 담을 배열
      const result = [
        `PI = ${PI}`,
        `add(3, 4) = ${add(3, 4)}`,
        `greet('홍길동') = ${greet(홍길동)}`,
      ];

      result.forEach((line) => {
        // HTML 요소(p 태그) 생성
        const p = document.createElement("p");
        p.textContent = line;
        output.appendChild(p);
        console.log(`요소 추가 : ${line}`);
      });
      //   console.log(`internalNote: ${internalNote}`); // ERROR: export가 아니기 때문
    </script>
  </body>
</html>
