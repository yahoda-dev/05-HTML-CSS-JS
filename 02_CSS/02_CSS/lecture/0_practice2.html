<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    .container {
      display: grid;
      border: 2px rgb(235, 232, 232) dashed;
      background-color: rgb(49, 49, 49);
      margin-top: 10px;
      gap: 10px;
    }

    .item {
      background: rgb(108, 162, 233);
      color: black;
      padding: 15px;
      text-align: center;
    }

    .col-px {
      /* 열의 개수와 너비를 정해주는 옵션 */
      /* grid-template-columns: 100px 100px 100px; */
      grid-template-columns: 2fr 1fr 1fr 1fr;
    }

    .row-fix {
      grid-template-rows: 80px 80px;
    }

    .layout {
      grid-template-columns: 200px 1fr;
      grid-template-rows: 60px 1fr 40px;
      grid-template-areas:
        "header" "header"
        "sidebar main"
        "footer footer";
      height: 300px;
    }
    .layout .head {
      grid-area: header;
      background: #1565c0;
    }
    .layout .side {
      grid-area: sidebar;
      background: #6a1b9a;
    }
    .layout .main {
      grid-area: main;
      background: #2e7d32;
    }
    .layout .foot {
      grid-area: footer;
      background: #455a64;
    }
  </style>
  <body>
    <h1>그리드 연습</h1>
    <div class="container layout">
      <div class="item header">1</div>
      <div class="item sidebar">2</div>
      <div class="item main">3</div>
      <div class="item footer">4</div>
    </div>
  </body>
</html>
